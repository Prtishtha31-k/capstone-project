<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ÒRME – Explore</title>
    <link rel="stylesheet" href="capsexplorepg.css">
</head>
<body>

    <aside class="sidebar">
        <div class="icon">🏠</div>
        <div class="icon">🔍</div>
        <div class="icon">📌</div>
        <div class="icon">➕</div>
        <div class="icon">🔔</div>
        <div class="icon">⚙️</div>
    </aside>
 
    <header class="header">
        <h1 class="logo">ÒRME</h1>

        <div class="search-box">
            <input type="text" placeholder="Explore destinations, hotels, adventures...">
        </div>

        <div class="profile">
            <img src="https://i.pravatar.cc/300" alt="profile">
        </div>
    </header>

      <section class="hero-section">
    <h2 class="hero-title" style="color: #3B2F2F;font-family:'Cinzel', serif;">Explore the World with ÒRME</h2>

    <div class="hero-grid">
        <div class="hero-card" style="background-image: url('https://images.unsplash.com/photo-1502602898657-3e91760cbb34');">
            <span class="hero-label">Countries</span>
        </div>

        <div class="hero-card" style="background-image: url('https://images.unsplash.com/photo-1505761671935-60b3a7427bad');">
            <span class="hero-label">Adventures</span>
        </div>

        <div class="hero-card" style="background-image: url('https://i.insider.com/5b980445672e1645d97594cb?width=700');">
            <span class="hero-label">Hotel Hunts</span>
        </div>
    </div>
    <div class="hero-grid">
        <div class="hero-card" style="background-image: url('https://images.unsplash.com/photo-1526778548025-fa2f459cd5c1');">
            <span class="hero-label">Itineraries</span>
        </div>

        <div class="hero-card" style="background-image: url('https://images.unsplash.com/photo-1500530855697-b586d89ba3ee');">
            <span class="hero-label">Travel Tips</span>
        </div>

        <div class="hero-card" style="background-image: url('https://images.unsplash.com/photo-1507525428034-b723cf961d3e');">
            <span class="hero-label">Beaches</span>
        </div>
    </div>
</section>

</body>
</html>
